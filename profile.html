<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профіль продавця — TechMarket</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #10131c;
  color: white;
}

header {
  background: #191e2c;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #30394d;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  color: #70e1ff;
  font-weight: bold;
  text-decoration: none;
}

.cart-button, .back-button {
  background: #70e1ff;
  color: #10131c;
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.header-buttons {
  display: flex;
  gap: 12px;
  align-items: center;
}

.back-button {
  background: #30394d;
  color: white;
}

.back-button:hover { background: #424f6b; }

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 20px;
}

.profile-card, .card, .cart-panel {
  background: #1c2231;
  border: 1px solid #30394d;
  border-radius: 15px;
}

.profile-card {
  padding: 25px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 35px;
}

.profile-card img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #70e1ff;
}

.profile-card h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.profile-card p {
  color: #9da8bd;
  font-size: 15px;
}

h2 { margin: 25px 0 20px; }

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  overflow: hidden;
  transition: .2s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #70e1ff;
}

.card > img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: white;
  padding: 15px;
}

.info {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.info p {
  color: #aab2c5;
  font-size: 14px;
  margin: 12px 0;
  flex: 1;
}

.price {
  font-size: 22px;
  color: #70e1ff;
  font-weight: bold;
}

.add-button {
  width: 100%;
  margin-top: 15px;
  background: #70e1ff;
  color: #10131c;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.add-button:hover { background: #40c8ee; }

#status {
  color: #70e1ff;
  margin-top: 15px;
}

/* КОШИК */
.cart-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #000b;
  z-index: 20;
}

.cart-overlay.active { display: block; }

.cart-panel {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 420px;
  max-width: 100%;
  padding: 25px;
  border-radius: 0;
  overflow-y: auto;
  background: #191e2c;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.close-button {
  background: #30394d;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.close-button:hover { background: #424f6b; }

.cart-item {
  display: flex;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #30394d;
}

.cart-item img {
  width: 70px;
  height: 70px;
  background: white;
  object-fit: contain;
  border-radius: 8px;
}

.cart-details { flex: 1; }

.cart-details p {
  color: #70e1ff;
  margin: 7px 0;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 10px;
}

.quantity button {
  background: #30394d;
  border: none;
  color: white;
  padding: 6px 11px;
  border-radius: 5px;
  cursor: pointer;
}

.remove {
  background: none !important;
  color: #ff7777 !important;
}

.cart-total {
  margin-top: 25px;
  font-size: 23px;
  color: #70e1ff;
  font-weight: bold;
}

.empty {
  color: #9da8bd;
  text-align: center;
  margin: 40px 0;
}

footer {
  text-align: center;
  padding: 30px;
  color: #818ba0;
}

/* АДАПТАЦІЯ */
@media(max-width: 850px) {
  .products { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 550px) {
  header { padding: 15px; }
  .logo { font-size: 19px; }
  .cart-button, .back-button {
    padding: 10px 12px;
    font-size: 13px;
  }
  main { padding: 25px 14px; }
  .profile-card { flex-direction: column; text-align: center; }
  .products { grid-template-columns: 1fr; gap: 15px; }
  .card > img { height: 200px; }
  .cart-panel { width: 100%; padding: 20px; }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">⚡ TechMarket</a>
  <div class="header-buttons">
    <a href="index.html" class="back-button">← Назад</a>
    <button class="cart-button" onclick="openCart()">
      🛒 Кошик (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<main>

<p id="status">Завантаження профілю...</p>

<div class="profile-card" id="profileCard" style="display: none;">
  <img id="sellerPhoto" src="" alt="Продавець">
  <div>
    <h1 id="sellerName">Ім'я продавця</h1>
    <p>Баланс: <strong id="sellerBalance" style="color: #70e1ff;">0</strong> ₴</p>
  </div>
</div>

<h2>📦 Товари цього продавця (<span id="sellerProductCount">0</span>)</h2>
<div class="products" id="sellerProducts"></div>

</main>

<!-- ВІКНО КОШИКА -->
<div class="cart-overlay" id="cartOverlay" onclick="overlayClick(event)">
  <div class="cart-panel">
    <div class="cart-header">
      <h2>🛒 Мій кошик</h2>
      <button class="close-button" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      Разом: <span id="cartTotal">0</span> ₴
    </div>
  </div>
</div>

<footer>
  © 2026 TechMarket | Powered by JSON API
</footer>

<script>
const API = "https://myjsons.com/v/2e925432";

let allProducts = [];
let cart = [];

try {
  cart = JSON.parse(localStorage.getItem("techCart")) || [];
  if (!Array.isArray(cart)) cart = [];
} catch {
  cart = [];
}

function saveCart() {
  localStorage.setItem("techCart", JSON.stringify(cart));
}

async function loadProfile() {
  const urlParams = new URLSearchParams(window.location.search);
  const sellerId = urlParams.get("id");

  if (!sellerId) {
    document.getElementById("status").textContent = "Продавця не вказано.";
    return;
  }

  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error("API error");

    const data = await response.json();

    const users = (data.users || []).map((u, idx) => ({
      ...u,
      id: u.id ?? idx + 1
    }));

    const seller = users.find(u => String(u.id) === String(sellerId));

    if (!seller) {
      document.getElementById("status").textContent = "Продавця не знайдено.";
      return;
    }

    allProducts = (data.products || []).map((p, idx) => {
      const sId = p.author_id ?? p.user_id ?? p.seller_id;
      const matchedSeller = sId !== undefined ? users.find(u => String(u.id) === String(sId)) : users[idx % users.length];
      return {
        ...p,
        sellerId: matchedSeller ? matchedSeller.id : null
      };
    });

    const sellerProducts = allProducts.filter(p => String(p.sellerId) === String(sellerId));

    // Заповнюємо дані продавця
    document.getElementById("sellerPhoto").src = safeURL(seller.photo_url);
    document.getElementById("sellerName.textContent" // оновлюємо безпечно нижче
    );
    document.getElementById("sellerName").textContent = `${seller.name || ""} ${seller.sirname || ""}`;
    document.getElementById("sellerBalance").textContent = seller.balance || 0;
    document.getElementById("sellerProductCount").textContent = sellerProducts.length;

    document.getElementById("profileCard").style.display = "flex";
    document.getElementById("status").style.display = "none";

    const container = document.getElementById("sellerProducts");
    if (!sellerProducts.length) {
      container.innerHTML = '<p class="empty">У цього продавця поки немає товарів.</p>';
    } else {
      container.innerHTML = sellerProducts.map(product => {
        // Знаходимо глобальний індекс у масиві товарів для коректного додавання в кошик
        const globalIndex = allProducts.findIndex(p => p === product);
        return `
          <div class="card">
            <img src="${safeURL(product.photo_url)}" alt="${escapeHTML(product.name)}">
            <div class="info">
              <h3>${escapeHTML(product.name)}</h3>
              <p>${escapeHTML(product.description || "")}</p>
              <div class="price">${escapeHTML(product.price)} ₴</div>
              <button class="add-button" onclick="addToCart(${globalIndex})">
                🛒 Додати в кошик
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    updateCart();

  } catch (error) {
    document.getElementById("status").textContent = "Помилка завантаження даних продавця.";
    console.error(error);
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? escapeHTML(url.href) : "";
  } catch {
    return "";
  }
}

function addToCart(index) {
  const product = allProducts[index];
  if (!product) return;

  const existing = cart.find(item => String(item.id) === String(product.id));

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price) || 0,
      photo_url: product.photo_url,
      quantity: 1
    });
  }

  saveCart();
  updateCart();
}

function changeQuantity(id, amount) {
  const item = cart.find(p => String(p.id) === String(id));
  if (!item) return;

  item.quantity += amount;
  if (item.quantity <= 0) {
    cart = cart.filter(p => String(p.id) !== String(id));
  }

  saveCart();
  updateCart();
}

function removeItem(id) {
  cart = cart.filter(p => String(p.id) !== String(id));
  saveCart();
  updateCart();
}

function updateCart() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = total;

  const container = document.getElementById("cartItems");

  if (!cart.length) {
    container.innerHTML = '<p class="empty">Твій кошик поки порожній 😔</p>';
    return;
  }

  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${safeURL(item.photo_url)}" alt="">
      <div class="cart-details">
        <strong>${escapeHTML(item.name)}</strong>
        <p>${item.price * item.quantity} ₴</p>
        <div class="quantity">
          <button onclick="changeQuantity('${escapeHTML(item.id)}', -1)">−</button>
          ${item.quantity}
          <button onclick="changeQuantity('${escapeHTML(item.id)}', 1)">+</button>
          <button class="remove" onclick="removeItem('${escapeHTML(item.id)}')">✕</button>
        </div>
      </div>
    </div>
  `).join("");
}

function openCart() {
  document.getElementById("cartOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

function overlayClick(event) {
  if (event.target.id === "cartOverlay") closeCart();
}

loadProfile();
</script>

</body>
</html>
